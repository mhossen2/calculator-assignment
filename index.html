<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Calculator</h1>
    <body>
 
<div class="machine">
  <div class="brand">
    <span class="brand-name">ADDING MACHINE</span>
    <span class="brand-model">MK.1</span>
  </div>
 
  <div class="screen">
    <div class="screen-tape" id="tape">&nbsp;</div>
    <div class="screen-value" id="display">0</div>
  </div>
 
  <div class="keys">
    <button class="key util" data-action="clear">AC</button>
    <button class="key util" data-action="backspace">⌫</button>
    <button class="key op" data-action="operator" data-operator="÷">÷</button>
    <button class="key op" data-action="operator" data-operator="×">×</button>
 
    <button class="key" data-action="digit" data-digit="7">7</button>
    <button class="key" data-action="digit" data-digit="8">8</button>
    <button class="key" data-action="digit" data-digit="9">9</button>
    <button class="key op" data-action="operator" data-operator="−">−</button>
 
    <button class="key" data-action="digit" data-digit="4">4</button>
    <button class="key" data-action="digit" data-digit="5">5</button>
    <button class="key" data-action="digit" data-digit="6">6</button>
    <button class="key op" data-action="operator" data-operator="+">+</button>
 
    <button class="key" data-action="digit" data-digit="1">1</button>
    <button class="key" data-action="digit" data-digit="2">2</button>
    <button class="key" data-action="digit" data-digit="3">3</button>
    <button class="key equals" data-action="equals">=</button>
 
    <button class="key zero" data-action="digit" data-digit="0">0</button>
    <button class="key" data-action="decimal">.</button>
  </div>
</div>
    <script src="./script.js"></script>
  </body>
</html>
