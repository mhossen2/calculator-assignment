<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculator {width: 260px;}
    .display {background-color: #222; color: #fff; font-size: 2em; padding: 10px; text-align: right;}
    .buttons {display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;}
     button {padding: 20px; font-size: 1.2em; cursor: pointer;}
    .operator {background-color: #f0ad4e; color: #fff;}
    .equals {background-color: #5cb85c; color: #fff; grid-column: span 2;}
    .clear {background-color: #d9534f; color: #fff;}  
  </style>
  <body>
    <body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="backspace" data-action="backspace">⌫</button>
      <button class="operator" data-operator="/">÷</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="+">+</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button data-number="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </div>
  <script src="script.js"></script>
  </body>
</html>
